name: 📣 Build release of QOwnNotes Web Companion

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags-ignore:
      - "*"

#--------------------------------------------------------------------------------
# Define application name & version
#--------------------------------------------------------------------------------

jobs:
  create_release:
    name: "🗃️️ Prepare release"
    permissions:
      contents: write # for actions/create-release to create a release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Set Env
        run: |
          export VERSION=$(jq -r '.version' package.json)
          export TAG=v${VERSION}
          export RELEASE_TEXT=$(grep -Pzo "## ${VERSION}\n(\n|.)+?\n##" CHANGELOG.md | sed '$ d')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          # add multiline release text
          echo "RELEASE_TEXT<<EOF" >> $GITHUB_ENV
          echo "${RELEASE_TEXT}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Printenv
        run: |
          echo "VERSION=${VERSION}"
          echo "TAG=${TAG}"
          echo "RELEASE_TEXT=${RELEASE_TEXT}"
          printenv
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: Release v${{ env.VERSION }}
          body: ${{ env.RELEASE_TEXT }}
          draft: true
          prerelease: false

  #
  # Package build
  #
  build-package:
    needs: create_release
    runs-on: ubuntu-latest
    name: "📦 Build packages"
    steps:
      - name: "🧰 Checkout"
        uses: actions/checkout@v4

      - name: "⚙️ Install dependencies"
        run: |
          npm install

      - name: "🚧 Build extension"
        run: ./build.sh

      - name: "📤 Release Chrome package"
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./dist/package-chrome.zip
          asset_name: package-chrome.zip
          asset_content_type: application/zip
      - name: "📤 Release Firefox package"
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ./dist/package-firefox.zip
          asset_name: package-firefox.zip
          asset_content_type: application/zip

      - name: "🗄️ Store packages for the store publishing jobs"
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/package-chrome.zip
            dist/package-firefox.zip
          retention-days: 7

  #
  # Store publishing (only for the release branch)
  #
  publish-chrome:
    name: "🌐 Publish to Chrome Web Store"
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    needs: build-package
    env:
      EXTENSION_ID: pkgkfnampapjbopomdpnkckbjdnpkbkp
      PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
    steps:
      - name: "🔑 Check credentials"
        id: check
        run: |
          if [ -z "$PUBLISHER_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::Chrome Web Store secrets are not set, skipping store upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "⚙️ Set up Node.js"
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "📥 Download packages"
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: "📣 Upload and submit for review"
        if: steps.check.outputs.skip != 'true'
        run: npx --yes chrome-webstore-upload-cli@4 --source dist/package-chrome.zip

  publish-firefox:
    name: "🦊 Publish to Firefox Add-ons"
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    needs: build-package
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: "🔑 Check credentials"
        id: check
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::warning::Firefox Add-ons secrets are not set, skipping store upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "🧰 Checkout"
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: "⚙️ Set up Node.js"
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "📥 Download packages"
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: "🗂️ Prepare extension, source code and metadata"
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION=$(jq -r '.version' package.json)
          mkdir -p dist/firefox-extension
          unzip -q dist/package-firefox.zip -d dist/firefox-extension
          # Source code of exactly the commit that is being released, for the Mozilla reviewers
          git archive --format=zip -o dist/sourcecode.zip HEAD
          # Release notes from the changelog section of the current version
          RELEASE_NOTES=$(awk -v v="## ${VERSION}" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md | sed '/^$/d')
          jq -n \
            --arg notes "$RELEASE_NOTES" \
            --arg approval "Build instructions: run 'npm install' and then './build.sh' (Node.js 24). The Firefox package will be at dist/package-firefox.zip." \
            '{version: {release_notes: {"en-US": $notes}, approval_notes: $approval}}' \
            > dist/amo-metadata.json
          cat dist/amo-metadata.json
      - name: "📣 Upload and submit for review"
        if: steps.check.outputs.skip != 'true'
        run: |
          npx --yes web-ext@8 sign \
            --channel=listed \
            --source-dir=dist/firefox-extension \
            --artifacts-dir=dist/web-ext-artifacts \
            --upload-source-code=dist/sourcecode.zip \
            --amo-metadata=dist/amo-metadata.json \
            --approval-timeout=0

  publish_release:
    name: 📣 Publish release
    runs-on: ubuntu-latest
    needs: [create_release, build-package]
    steps:
      - name: 📣 Publish draft release
        uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.create_release.outputs.release_id }}
